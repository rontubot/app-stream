<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142018" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0f0d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00aa44"/>
    </linearGradient>
    <radialGradient id="glowCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo sutil con rejilla -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <circle cx="200" cy="220" r="180" fill="url(#glowCircle)"/>

  <!-- Silueta Boxeador en guardia -->
  <g fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Cabeza -->
    <circle cx="200" cy="140" r="45" fill="#0d1812" stroke="#00ff66" stroke-width="3"/>
    <!-- Casco o Ceño protector -->
    <path d="M 170 135 Q 200 120 230 135" stroke="#00ff66" stroke-width="3"/>
    
    <!-- Torso y Hombros -->
    <path d="M 140 220 Q 200 240 260 220 L 245 370 Q 200 380 155 370 Z" fill="#0d1812" stroke="#00ff66" stroke-width="2.5"/>
    
    <!-- Cuello -->
    <path d="M 180 180 L 180 215 M 220 180 L 220 215" stroke="#00ff66" stroke-width="2.5"/>
    
    <!-- Brazo Izquierdo (Guardia) -->
    <path d="M 140 220 Q 110 210 115 170 Q 120 130 155 140" stroke="#00ff66" stroke-width="4"/>
    <!-- Guante Izquierdo -->
    <circle cx="155" cy="140" r="24" fill="#00ff66" fill-opacity="0.2" stroke="#00ff66" stroke-width="3.5"/>
    <path d="M 145 130 Q 165 130 160 150" stroke="#00ff66" stroke-width="2"/>

    <!-- Brazo Derecho (Guardia) -->
    <path d="M 260 220 Q 290 210 285 170 Q 280 130 245 140" stroke="#00ff66" stroke-width="4"/>
    <!-- Guante Derecho -->
    <circle cx="245" cy="140" r="24" fill="#00ff66" fill-opacity="0.2" stroke="#00ff66" stroke-width="3.5"/>
    <path d="M 235 130 Q 255 130 250 150" stroke="#00ff66" stroke-width="2"/>
    
    <!-- Cinturón / Shorts -->
    <path d="M 150 370 L 250 370 L 245 440 L 155 440 Z" fill="#070c09" stroke="#00ff66" stroke-width="2"/>
    <path d="M 180 370 L 180 440 M 220 370 L 220 440" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Texto de Subir Foto -->
  <text x="200" y="475" text-anchor="middle" fill="#00ff66" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="700" letter-spacing="2">
    SUBE TU FOTO PNG
  </text>
</svg>
