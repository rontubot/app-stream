<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Overlay - Dual Slot (Left & Right)</title>
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div id="overlay-stage">
    <!-- SLOT IZQUIERDO -->
    <div id="slot-left" class="slot-wrapper">
      <div class="overlay-card">
        <div class="cyber-shimmer"></div>
        <div class="overlay-top-row">
          <div class="presenter-name"></div>
          <div class="presenter-nickname"></div>
        </div>
        <div class="overlay-bottom-left">
          <div class="platform-badge"></div>
          <div class="presenter-handle"></div>
        </div>
        <div class="overlay-bottom-right">
          <div class="presenter-role"></div>
        </div>
      </div>
    </div>

    <!-- SLOT DERECHO -->
    <div id="slot-right" class="slot-wrapper">
      <div class="overlay-card">
        <div class="cyber-shimmer"></div>
        <div class="overlay-top-row">
          <div class="presenter-name"></div>
          <div class="presenter-nickname"></div>
        </div>
        <div class="overlay-bottom-left">
          <div class="platform-badge"></div>
          <div class="presenter-handle"></div>
        </div>
        <div class="overlay-bottom-right">
          <div class="presenter-role"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
