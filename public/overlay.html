<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Overlay - OBS Browser Source</title>
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <div id="overlay-stage">
    <div id="overlay-wrapper" class="overlay-wrapper pos-bottom-left anim-slide-left">
      <div class="overlay-card">
        <!-- Efecto de brillo cyber que pasa periódicamente -->
        <div class="cyber-shimmer"></div>

        <!-- Fila Superior: Nombre y Alias -->
        <div class="overlay-top-row">
          <div id="presenter-name" class="presenter-name">LUIS MIGUEL ARRIETA</div>
          <div id="presenter-nickname" class="presenter-nickname">“LUISMI”</div>
        </div>

        <!-- Fila Inferior Izquierda: Plataforma y Handle -->
        <div class="overlay-bottom-left">
          <div id="platform-badge">
            <span class="platform-badge kick-style">
              <svg class="kick-svg" viewBox="0 0 24 24" width="28" height="28" fill="#00ff66">
                <path d="M3 3h4v6h3V6h4v3h-3v6h3v3h-4v-3h-3v6H3V3zm15 3h3v12h-3V6z"/>
              </svg>
              KICK
            </span>
          </div>
          <div id="presenter-handle" class="presenter-handle">@LUISMISHIT</div>
        </div>

        <!-- Fila Inferior Derecha: Rol / Cargo -->
        <div class="overlay-bottom-right">
          <div id="presenter-role" class="presenter-role">DESIG</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
