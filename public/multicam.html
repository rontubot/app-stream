<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay OBS Multicam - BirraVerde</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/multicam.css">
</head>
<body>
  <!-- Escenario transparente de OBS (1920x1080) -->
  <div id="multicam-stage" class="scene-pip-corner-tr">
    <!-- Fondo animado BirraVerde para modo Mosaico Completo (Grid) -->
    <div id="multicam-grid-backdrop" class="multicam-grid-backdrop">
      <div class="cyber-grid-3d"></div>
      <div class="cyber-radar-glow"></div>
      <div class="cyber-scanline"></div>
      <div class="multicam-laser-sweep">
        <div class="laser-beam">
          <div class="laser-core"></div>
          <div class="laser-trail"></div>
          <div class="laser-glare"></div>
        </div>
      </div>

      <!-- Logo BirraVerde Central Holográfico de Fondo -->
      <div class="multicam-grid-watermark-logo">
        <img src="/assets/logo-birraverde.png" alt="BirraVerde" class="grid-watermark-img">
      </div>

      <!-- Header Branding Superior BirraVerde (Ajustable dinámicamente) -->
      <div class="multicam-grid-branding">
        <div class="grid-brand-badge">
          <img src="/assets/logo-birraverde.png" alt="BirraVerde" class="grid-brand-logo">
          <div class="grid-brand-info">
            <span class="grid-brand-title">BIRRAVERDE</span>
            <span class="grid-brand-subtitle">TRANSMISIÓN EN VIVO</span>
          </div>
        </div>
      </div>
    </div>
    <!-- Contenedor dinámico donde se inyectan las cámaras -->
    <div id="cams-container"></div>
  </div>

  <!-- Contenedor oculto de elementos de audio para que OBS reproduzca el sonido de la llamada -->
  <div id="audio-container" style="display:none;"></div>

  <script src="/js/multicam.js?v=20261109e"></script>
</body>
</html>
